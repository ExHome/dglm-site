# Régénération et déploiement automatiques.
# Le site se reconstruit à chaque modification ET tous les matins :
# les dates réglementaires, les « X ans de retard », le lastmod du sitemap et
# la mention de mise à jour se recalculent seuls. Aucune page ne vieillit.
name: Build, audit et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"  # tous les jours 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Générer le site
        run: python3 build.py

      - name: Audit SEO — bloquant
        run: python3 audit_seo.py

      # Compare l'état du site à la dernière référence enregistrée.
      # Bloque le déploiement si un indicateur régresse : pages disparues,
      # contenu qui s'allège, poids qui grimpe, pages devenues orphelines.
      - name: Veille SEO — détection de régression
        run: python3 veille_seo.py

      # Interroge les fiches Service Public surveillées et signale toute
      # évolution de leur date « Vérifié le ». Non bloquant : un changement
      # de date appelle une relecture humaine, pas un arrêt du déploiement.
      - name: Veille réglementaire — Service Public
        continue-on-error: true
        run: python3 veille_reglementaire.py

      - name: Enregistrer la nouvelle référence
        run: |
          git config user.name  "veille-seo"
          git config user.email "veille@dglmexpertises.fr"
          git add .seo-history.json
          git diff --staged --quiet || git commit -m "veille SEO $(date +%F)"
          git push || true

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # APRÈS la mise en ligne, et pas avant : IndexNow vérifie la clé en
      # allant la lire sur le site. Tant que cette étape précédait le
      # déploiement, elle annonçait des pages en s'appuyant sur un fichier-clé
      # pas encore publié — d'où un refus systématique.
      - name: Ping des moteurs (IndexNow, en masse)
        continue-on-error: true
        run: |
          # La clé est publique (elle est servie à la racine du site) : le
          # secret n'est qu'un moyen de la surcharger, pas une condition.
          KEY="${{ secrets.INDEXNOW_KEY }}"
          if [ -z "$KEY" ]; then KEY="edf67dcafdd8f3778243f8d9c952894a"; fi
          HOTE="www.dglmexpertises.fr"
          curl -s "https://$HOTE/sitemap.xml" \
            | grep -oP '(?<=<loc>)[^<]+' > urls.txt
          echo "$(wc -l < urls.txt) adresses au plan du site"
          # par lots de 100 : une soumission unique de 249 adresses est refusée
          split -l 100 urls.txt lot_
          for f in lot_*; do
            LIST=$(sed 's/.*/"&"/' "$f" | paste -sd,)
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "{\"host\":\"$HOTE\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOTE/${KEY}.txt\",\"urlList\":[$LIST]}" \
              -o /dev/null -w "  $f : HTTP %{http_code}\n" || true
            sleep 20
          done
